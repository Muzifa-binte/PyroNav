# PyroNav — PostgreSQL + MQTT broker (Mosquitto) + backend API
#
# Live sensor path: 3D app (browser) --MQTT/WebSocket :9001--> mosquitto
#   --MQTT :1883--> sensor ingestion inside the API --> ws://localhost:8000/ws/v1/live
#
#   docker compose up -d --build     # start (migrations + demo data load automatically)
#   docker compose logs -f api       # follow API logs
#   docker compose down              # stop; database kept in the "pgdata" volume
#   docker compose down -v           # stop AND delete the database
#
# Database only (run the API from your IDE / virtualenv instead):
#   docker compose up -d db
#
# Values below can be overridden in a .env file next to this one (see docs/DEPLOYMENT.md).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pyronav_db}
      POSTGRES_USER: ${DB_USER:-pyronav_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    ports:
      - "${MQTT_PUBLISH_PORT:-1883}:1883"        # MQTT/TCP — Python services
      - "${MQTT_WS_PUBLISH_PORT:-9001}:9001"     # MQTT over WebSockets — the 3D app in the browser
    volumes:
      - ./backend/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pyronav_db}
      DB_USER: ${DB_USER:-pyronav_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # true: reset the building to the shared-contracts demo hospital on every start
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_FALLBACK: ${DEMO_FALLBACK:-true}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-true}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      # Member 1's MQTT ingestion runs inside the API, so readings reach the
      # decision engine and /ws/v1/live over the in-process event bus
      BACKGROUND_SERVICES: ${BACKGROUND_SERVICES:-sensor_ingestion.service}
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    volumes:
      - apilogs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  apilogs:
