# =============================================================================
# PyroNav Mosquitto config for a NATIVE Windows install (no Docker).
# Same listeners as mosquitto.conf, but bound to this computer only, because
# anonymous access must not be reachable from the local network.
#
# Install (as administrator): copy this file over
#   C:\Program Files\mosquitto\mosquitto.conf
# then:  Restart-Service mosquitto
# Logs:  C:\ProgramData\mosquitto\mosquitto.log
# =============================================================================

per_listener_settings false
allow_anonymous true

# MQTT/TCP — Python services (sensor ingestion, test_publisher.py)
listener 1883 127.0.0.1
protocol mqtt

# MQTT over WebSockets — the 3D app in the browser (ws://localhost:9001)
listener 9001 127.0.0.1
protocol websockets

persistence false
message_size_limit 65536

log_dest file C:/ProgramData/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
