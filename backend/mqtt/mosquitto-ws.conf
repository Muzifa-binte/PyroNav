# PyroNav — Mosquitto WebSocket-only config
# Use this when the system Mosquitto service already holds port 1883.
# Starts ONE listener on 9001 (WebSockets) only.
# The browser (hospital-3d) connects to ws://localhost:9001
# The Python backend/sensor_ingestion uses the system broker on TCP 1883.

per_listener_settings false
allow_anonymous true

listener 9001
protocol websockets

# Keep connections alive
max_keepalive 0
max_connections -1

persistence false
message_size_limit 65536

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
