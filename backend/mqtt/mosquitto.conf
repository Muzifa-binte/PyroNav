# =============================================================================
# PyroNav — Eclipse Mosquitto 2.x broker configuration (Member 1)
#
#   Native:  mosquitto -c backend/mqtt/mosquitto.conf -v
#   Docker:  docker compose -f backend/mqtt/docker-compose.yml up -d
#
# Two listeners on the same broker:
#   1883  MQTT over TCP         → Python services (sensor_ingestion, simulator,
#                                 test_publisher.py), mosquitto_sub/pub, MQTT Explorer
#   9001  MQTT over WebSockets  → browsers (hospital-3d app uses mqtt.js); a browser
#                                 cannot open raw TCP sockets, so this one is required
#
# Topic contract: shared-contracts/sensor-message-schema.json
#   pyronav/v1/sensors/{room_id}/{sensor_id}/reading
# =============================================================================

# One security policy for every listener
per_listener_settings false

# DEVELOPMENT ONLY — anyone on the network can publish/subscribe.
# For a shared or production broker, comment this out and enable the
# password_file / acl_file lines at the bottom (see backend/mqtt/README.md).
allow_anonymous true

# ── Listeners ────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Behaviour ────────────────────────────────────────────────────────────────
# Readings are live data; nothing needs to survive a broker restart.
persistence false

# Sensor messages are < 1 KB; reject anything absurd.
message_size_limit 65536

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Authentication (enable for anything beyond local development) ────────────
# Create users:  mosquitto_passwd -c backend/mqtt/passwords pyronav_ingestion
#                mosquitto_passwd    backend/mqtt/passwords hospital3d
# then set MQTT_USERNAME/MQTT_PASSWORD (backend/.env) and
# VITE_MQTT_USERNAME/VITE_MQTT_PASSWORD (hospital-3d/.env).
#password_file /mosquitto/config/passwords
#acl_file      /mosquitto/config/acl
